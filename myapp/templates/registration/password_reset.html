<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ContractorHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --navy: #0a1628;
            --blue: #1a3a6b;
            --gold: #c9903a;
            --gold-light: #e8a84a;
            --cream: #f8f4ee;
            --white: #ffffff;
            --gray: #64748b;
            --light: #f1f5f9;
            --border: #e2e8f0;
            --error: #dc2626;
            --error-bg: #fee2e2;
            --success: #059669;
            --success-bg: #d1fae5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--navy);
            color: var(--navy);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a6b 50%, #0d2347 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: -50%;
            background-image:
                linear-gradient(rgba(201,144,58,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,144,58,0.08) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            z-index: -1;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(60px) translateX(60px); }
        }

        .floating-shapes { position: fixed; inset: 0; pointer-events: none; z-index: -1; }
        .shape { position: absolute; border: 1px solid rgba(201,144,58,0.15); border-radius: 50%; animation: floatShape 15s ease-in-out infinite; }
        .shape:nth-child(1) { width: 300px; height: 300px; top: 10%; right: 15%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 500px; height: 500px; top: -10%; right: 5%; animation-delay: -5s; border-color: rgba(201,144,58,0.08); }
        .shape:nth-child(3) { width: 200px; height: 200px; bottom: 20%; right: 30%; animation-delay: -10s; border-color: rgba(26,58,107,0.5); background: rgba(201,144,58,0.04); }
        .shape:nth-child(4) { width: 150px; height: 150px; top: 60%; left: 10%; animation-delay: -7s; }

        @keyframes floatShape {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(5deg); }
            66% { transform: translateY(10px) rotate(-3deg); }
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            animation: fadeInUp 0.8s ease both;
            position: relative;
            z-index: 10;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            background: linear-gradient(145deg, var(--navy), #0d1f38);
            padding: 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .auth-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(201,144,58,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,144,58,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--white);
            letter-spacing: -0.5px;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 2;
            text-decoration: none;
            display: block;
        }

        .brand-logo span { color: var(--gold); }

        .lock-icon {
            width: 70px;
            height: 70px;
            background: rgba(201,144,58,0.15);
            border: 2px solid rgba(201,144,58,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            position: relative;
            z-index: 2;
        }

        .lock-icon i {
            font-size: 1.8rem;
            color: var(--gold);
        }

        .auth-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--white);
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 2;
        }

        .auth-header p {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            position: relative;
            z-index: 2;
        }

        .auth-body { padding: 2.5rem; }

        .input-group { margin-bottom: 1.5rem; }

        .input-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 0.4rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: var(--gray);
            font-size: 1rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: var(--white);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201,144,58,0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: var(--gold);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .auth-btn:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(201,144,58,0.3);
        }

        .back-link {
            text-align: center;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .back-link a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .back-link a:hover { text-decoration: underline; }

        .help-text {
            background: var(--light);
            border-left: 3px solid var(--gold);
            border-radius: 0 8px 8px 0;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: var(--gray);
            line-height: 1.6;
        }

        .help-text i { color: var(--gold); margin-right: 0.4rem; }

        @media (max-width: 480px) {
            .auth-body { padding: 1.5rem; }
            .auth-header { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <a href="{% url 'login' %}" class="brand-logo">Contractor<span>Hub</span></a>
                <div class="lock-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h2>Forgot Password?</h2>
                <p>No worries! Enter your email and we'll send you a reset link.</p>
            </div>

            <div class="auth-body">
                <div class="help-text">
                    <i class="fas fa-info-circle"></i>
                    Enter the email address linked to your ContractorHub account. We'll send you a secure link to reset your password.
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="input-group">
                        <label class="input-label">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" name="email" placeholder="Enter your email address" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn">
                        <i class="fas fa-paper-plane"></i> Send Reset Link
                    </button>
                </form>

                <div class="back-link">
                    <a href="{% url 'login' %}">
                        <i class="fas fa-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
