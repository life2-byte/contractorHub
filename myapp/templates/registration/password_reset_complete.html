<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - ContractorHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --navy: #0a1628;
            --blue: #1a3a6b;
            --gold: #c9903a;
            --gold-light: #e8a84a;
            --white: #ffffff;
            --gray: #64748b;
            --light: #f1f5f9;
            --border: #e2e8f0;
            --success: #059669;
            --success-bg: #d1fae5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--navy);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a6b 50%, #0d2347 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: -50%;
            background-image:
                linear-gradient(rgba(201,144,58,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,144,58,0.08) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            z-index: -1;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(60px) translateX(60px); }
        }

        .floating-shapes { position: fixed; inset: 0; pointer-events: none; z-index: -1; }
        .shape { position: absolute; border: 1px solid rgba(201,144,58,0.15); border-radius: 50%; animation: floatShape 15s ease-in-out infinite; }
        .shape:nth-child(1) { width: 300px; height: 300px; top: 10%; right: 15%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 500px; height: 500px; top: -10%; right: 5%; animation-delay: -5s; border-color: rgba(201,144,58,0.08); }
        .shape:nth-child(3) { width: 200px; height: 200px; bottom: 20%; right: 30%; animation-delay: -10s; }
        .shape:nth-child(4) { width: 150px; height: 150px; top: 60%; left: 10%; animation-delay: -7s; }

        @keyframes floatShape {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(5deg); }
            66% { transform: translateY(10px) rotate(-3deg); }
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255,255,255,0.98);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            animation: fadeInUp 0.8s ease both;
            position: relative;
            z-index: 10;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            background: linear-gradient(145deg, var(--navy), #0d1f38);
            padding: 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .auth-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(201,144,58,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,144,58,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--white);
            letter-spacing: -0.5px;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 2;
            text-decoration: none;
            display: block;
        }

        .brand-logo span { color: var(--gold); }

        .success-icon {
            width: 90px;
            height: 90px;
            background: rgba(5,150,105,0.15);
            border: 2px solid rgba(5,150,105,0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            position: relative;
            z-index: 2;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s both;
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .success-icon i { font-size: 2.5rem; color: #059669; }

        .auth-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            color: var(--white);
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 2;
        }

        .auth-header p {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            position: relative;
            z-index: 2;
        }

        .auth-body { padding: 2.5rem; color: var(--navy); text-align: center; }

        .success-message {
            background: var(--success-bg);
            border: 1.5px solid #6ee7b7;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            color: var(--success);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-align: left;
        }

        .success-message i { font-size: 1.2rem; flex-shrink: 0; }

        .info-text {
            color: var(--gray);
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .confetti-row {
            font-size: 2rem;
            margin-bottom: 1rem;
            animation: bounce 1s ease infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: var(--gold);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .auth-btn:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(201,144,58,0.3);
        }

        .auto-redirect {
            margin-top: 1rem;
            font-size: 0.82rem;
            color: var(--gray);
        }

        #countdown { font-weight: 700; color: var(--gold); }

        @media (max-width: 480px) {
            .auth-body { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <a href="{% url 'login' %}" class="brand-logo">Contractor<span>Hub</span></a>
                <div class="success-icon">
                    <i class="fas fa-shield-check"></i>
                </div>
                <h2>Password Updated!</h2>
                <p>Your account is now secure</p>
            </div>

            <div class="auth-body">
                <div class="confetti-row">🎉</div>

                <div class="success-message">
                    <i class="fas fa-check-circle"></i>
                    Your password has been successfully updated and saved in the database!
                </div>

                <p class="info-text">
                    Great! Your ContractorHub account password has been changed. You can now log in with your new password.
                </p>

                <a href="{% url 'login' %}" class="auth-btn" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Go to Login
                </a>

                <div class="auto-redirect">
                    Redirecting automatically in <span id="countdown">5</span> seconds...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auto redirect countdown
        let count = 5;
        const countEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            count--;
            countEl.textContent = count;
            if (count <= 0) {
                clearInterval(timer);
                window.location.href = "{% url 'login' %}";
            }
        }, 1000);
    </script>
</body>
</html>
